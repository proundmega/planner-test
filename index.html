<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Benchmark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CPU Benchmark</h1>
            <p>Test your processor's single-core performance.</p>
        </header>
        <main>
            <div class="benchmark-card">
                <h2>Single Core Test</h2>
                <p>Calculates prime numbers to measure CPU speed.</p>
                <button id="startBtn">Start Benchmark</button>
                <div id="result" class="result hidden">
                    <h3>Result: <span id="score">0</span> ms</h3>
                    <p id="details"></p>
                </div>
            </div>
        </main>
        <footer>
            <p>Generated by AI Assistant</p>
        </footer>
    </div>
