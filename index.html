<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Task Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>Pomodoro Timer</h1>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
    </header>

    <main class="timer-container">
      <div class="session-badge" id="session-badge">Work</div>
      
      <div class="timer-ring-container">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="timer-ring-bg" cx="60" cy="60" r="54" fill="none" stroke-width="8"></circle>
          <circle class="timer-ring-progress" cx="60" cy="60" r="54" fill="none" stroke-width="8" stroke-dasharray="339.292" stroke-dashoffset="0"></circle>
        </svg>
        <div class="time-display" id="time-display">25:00</div>
      </div>

      <div class="session-info">
        <div class="stat">
          <span class="stat-value" id="completed-pomodoros">0</span>
          <span class="stat-label">Pomodoros</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-time">00:00</span>
          <span class="stat-label">Elapsed</span>
        </div>
      </div>

      <div class="controls">
        <button id="reset-btn" class="btn btn-secondary">Reset</button>
        <button id="start-pause-btn" class="btn btn-primary">Start</button>
        <button id="skip-btn" class="btn btn-secondary">Skip</button>
      </div>
    </main>

    <button id="settings-btn" class="settings-trigger">Settings</button>

    <div id="settings-modal" class="modal-overlay" hidden>
      <div class="modal-content">
        <h2>Settings</h2>
        <form id="settings-form">
          <div class="form-group">
            <label for="work-duration">Work Duration (min)</label>
            <input type="number" id="work-duration" min="1" max="60" value="25">
          </div>
          <div class="form-group">
            <label for="short-break-duration">Short Break (min)</label>
            <input type="number" id="short-break-duration" min="1" max="30" value="5">
          </div>
          <div class="form-group">
            <label for="long-break-duration">Long Break (min)</label>
            <input type="number" id="long-break-duration" min="1" max="45" value="15">
          </div>
          <div class="form-group">
            <label for="sessions-before-long-break">Sessions before Long Break</label>
            <input type="number" id="sessions-before-long-break" min="1" max="10" value="4">
          </div>
          <div class="modal-actions">
            <button type="button" id="close-settings" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
