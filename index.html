<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Weather Dashboard</h1>
      <div class="search-container">
        <input type="text" id="city-search" placeholder="Search for a city..." autocomplete="off">
        <div id="autocomplete-list" class="autocomplete-list hidden"></div>
      </div>
    </header>
    <main>
      <section id="current-weather" class="weather-card hidden">
        <h2 id="city-name"></h2>
        <div class="weather-info">
          <div class="temp-container">
            <span id="weather-icon" class="weather-icon"></span>
            <span id="temperature" class="temperature"></span>
          </div>
          <p id="weather-description" class="description"></p>
          <div class="details">
            <div class="detail-item">
              <span class="label">Humidity</span>
              <span id="humidity" class="value"></span>
            </div>
            <div class="detail-item">
              <span class="label">Wind</span>
              <span id="wind-speed" class="value"></span>
            </div>
          </div>
        </div>
      </section>

      <section id="forecast-section" class="hidden">
        <h2>5-Day Forecast</h2>
        <div id="forecast-container" class="forecast-grid"></div>
      </section>

      <section id="recent-searches" class="recent-searches hidden">
        <h3>Recent Searches</h3>
        <div id="recent-list" class="recent-list"></div>
      </section>

      <div id="loading" class="loading hidden">Loading...</div>
      <div id="error-message" class="error-message hidden"></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
