<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Benchmark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CPU Benchmark</h1>
        <p>Test your processor's single-core performance.</p>
        <button id="startBtn">Run Benchmark</button>
        <div id="result" class="hidden">
            <h2>Score: <span id="score">0</span></h2>
            <p>Time: <span id="time">0</span> ms</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
