<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Benchmark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CPU Benchmark</h1>
            <p>Test your processor's single-thread performance</p>
        </header>
        <main>
            <div class="benchmark-card">
                <div id="status" class="status">Ready</div>
                <div id="score" class="score">0</div>
                <button id="run-btn">Run Benchmark</button>
            </div>
            <div class="info">
                <p>This benchmark runs a CPU-intensive calculation loop to estimate performance.</p>
                <p>Higher scores indicate better performance.</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
